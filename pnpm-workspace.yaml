packages:
  - contracts
  - packages/*
  - apps/*
  - services/*
  - scripts

allowBuilds:
  '@reown/appkit': false
  bufferutil: false
  esbuild: false
  keccak: false
  utf-8-validate: false

minimumReleaseAgeExclude:
  - '@privy-io/api-base@2.1.0'
  - '@privy-io/chains@1.0.0'
  - '@privy-io/js-sdk-core@0.79.5'
  - '@privy-io/react-auth@3.51.4'
  - '@privy-io/routes@0.5.1'
  - '@privy-io/urls@0.0.6'
  - jsdom@31.0.1
  - '@hono/node-server@2.1.8'
