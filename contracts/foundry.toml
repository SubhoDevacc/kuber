[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["lib"]
solc = "0.8.38"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
fs_permissions = [{ access = "read-write", path = "./out" }]

[profile.default.fuzz]
runs = 1000

[profile.default.invariant]
runs = 32
depth = 400
fail_on_revert = true
show_metrics = true
# "auto" resolves to one worker unless --jobs is given; 8 workers run the 32 runs about 6x faster.
workers = 8

[profile.full.fuzz]
runs = 10000

[profile.full.invariant]
runs = 128
depth = 500

# forge coverage reruns every test instrumented; 07-05's gate runs it with FOUNDRY_PROFILE=coverage.
[profile.coverage.fuzz]
runs = 64

[profile.coverage.invariant]
runs = 4
depth = 200
